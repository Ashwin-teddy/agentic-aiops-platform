services:
  - type: web
    name: aiops-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aiops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: aiops-redis
          type: redis
          property: connectionString
      - key: QDRANT_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://*.vercel.app"]'
    healthCheckPath: /api/v1/health
    autoDeploy: true

  - type: postgres
    name: aiops-db
    region: oregon
    plan: free
    databaseName: aiops_db
    ipAllowList: []

  - type: redis
    name: aiops-redis
    region: oregon
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
