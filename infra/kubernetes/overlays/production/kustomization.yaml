apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/deployments/backend.yaml
  - ../../base/services/backend.yaml
  - ../../base/configmaps/config.yaml
  - ../../base/secrets/secrets.yaml

namespace: aiops-production

patches:
  - target:
      kind: Deployment
      name: aiops-backend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 5
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "4Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"

configMapGenerator:
  - name: aiops-config
    behavior: merge
    literals:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_WORKERS=8
