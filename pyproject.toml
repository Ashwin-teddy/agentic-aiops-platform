[project]
name = "agentic-aiops-platform"
version = "1.0.0"
description = "Production-ready Agentic AI Platform for IT Operations Automation"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.25,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",
    "redis[hiredis]>=5.0.0,<6.0.0",
    "qdrant-client>=1.7.0,<2.0.0",
    "langchain-core>=0.1.0,<1.0.0",
    "langgraph>=0.0.20,<1.0.0",
    "openai>=1.12.0,<2.0.0",
    "anthropic>=0.34.0,<1.0.0",
    "google-genai>=1.0.0,<2.0.0",
    "tiktoken>=0.5.0,<1.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0,<1.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "opentelemetry-api>=1.22.0,<2.0.0",
    "opentelemetry-sdk>=1.22.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.22.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0,<1.0.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.43b0,<1.0.0",
    "opentelemetry-instrumentation-redis>=0.43b0,<1.0.0",
    "opentelemetry-instrumentation-httpx>=0.43b0,<1.0.0",
    "structlog>=24.1.0,<25.0.0",
    "prometheus-client>=0.19.0,<1.0.0",
    "cryptography>=42.0.0,<43.0.0",
    "tenacity>=8.2.0,<9.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
    "pre-commit>=3.6.0,<4.0.0",
    "factory-boy>=3.3.0,<4.0.0",
    "faker>=22.0.0,<23.0.0",
]
docs = [
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.5.0,<10.0.0",
    "mkdocstrings[python]>=0.24.0,<1.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA"]
ignore = ["S101", "COM812", "ISC001"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "backend"

[[tool.mypy.overrides]]
module = ["langgraph.*", "qdrant_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow-running tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.setuptools.packages.find]
include = ["backend*"]
